name: Сбор трендов hh.ru

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

jobs:
  collect-trends:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: |
          pip install -r requirements.txt

      - name: Запустить скрипт сбора данных
        run: |
          python scripts/hh_trends.py

      - name: Сохранить изменения в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trends.json
          git diff --staged --quiet || git commit -m "Автоматическое обновление трендов hh.ru $(date +'%Y-%m-%d')"
          git push
